name: Scrape CSV Data

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout canonical data history
        uses: actions/checkout@v4
        with:
          ref: refs/heads/data
          path: .tmp/published-data

      - name: Set release date
        run: echo "TARGET_TAG=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run baseline:prepare

      - name: Scrape RealmEye (strict)
        run: bun run scripts/scrape.ts --source realmeye --strict

      - name: Scrape RealmStock (strict)
        run: bun run scripts/scrape.ts --source realmstock --strict

      - name: Scrape launcher (strict)
        run: bun run scripts/scrape.ts --source launcher --strict

      - name: Verify CSV growth
        run: bun run baseline:verify

      - name: Aggregate daily JSON
        run: bun run aggregate

      - name: Publish canonical data snapshot
        run: bun run scripts/publish-snapshot.ts

      - name: Ensure daily release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh release view "$TARGET_TAG" -R "${{ github.repository }}" > /dev/null 2>&1; then
              break
            fi
            if gh release create "$TARGET_TAG" -R "${{ github.repository }}" --title "Data $TARGET_TAG" --notes "Automated daily data release."; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Upload CSV assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in data/realmeye-full.csv data/realmstock-full.csv data/launcher-full.csv; do
            for attempt in 1 2 3; do
              if gh release upload "$TARGET_TAG" -R "${{ github.repository }}" "$file" --clobber; then
                break
              fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          done

      - name: Preserve samples after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/*.csv
            src/data/daily.json
          if-no-files-found: ignore
          retention-days: 30
