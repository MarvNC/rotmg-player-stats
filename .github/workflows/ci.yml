name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Lint
            command: bun run lint
          - name: Prettier check
            command: bun run format:check
          - name: Test
            command: bun run test
          - name: Build
            command: bun run build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  realmeye-browser-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'dot/realmeye-access-interstitial'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify the final result of one normal navigation
        run: |
          npm install --prefix "$RUNNER_TEMP/realmeye-probe" --no-audit --no-fund playwright@1.62.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/realmeye-probe/node_modules/playwright/index.mjs" bun - <<'PROBE'
          import { readRealmEyeCount } from "./scripts/lib/realmeye.ts";
          const { chromium } = await import(process.env.PLAYWRIGHT_MODULE);
          const browser = await chromium.launch({ channel: "chrome", chromiumSandbox: true, timeout: 15000 });
          try {
            const url = "https://www.realmeye.com/number-of-active-players-by-rank";
            const page = await browser.newPage();
            let status;
            let restricted = false;
            page.on("response", (response) => {
              if (!response.request().isNavigationRequest() || response.frame() !== page.mainFrame()) return;
              status = response.status();
              restricted ||= response.headers()["cf-mitigated"] === "challenge" || status === 403 || status === 429;
            });
            try {
              await page.goto(url, { waitUntil: "commit", timeout: 15000 });
            } catch (error) {
              if (!String(error).includes("ERR_ABORTED")) throw error;
              console.log("Initial navigation aborted; checking the current document without retrying.");
            }
            const cutoff = Date.now() + 6500;
            while (!restricted && Date.now() < cutoff) {
              const title = await page.title().catch(() => "");
              if (/just a moment|verify you are human|access denied/i.test(title)) {
                restricted = true;
                break;
              }
              if (page.url() === url && /number of active players by rank/i.test(title)) {
                await page.waitForLoadState("domcontentloaded", { timeout: 2500 });
                const count = await readRealmEyeCount(new Response(await page.content()));
                const displayed = await page.locator("body").innerText({ timeout: 2500 });
                const renderedCount = Number(displayed.match(/We.ve seen\s+([\d,]+)\s+players\./i)?.[1]?.replaceAll(",", ""));
                if (!Number.isSafeInteger(count) || count <= 0 || count !== renderedCount || restricted) throw new Error("Could not verify the same positive count in the displayed chart.");
                console.log("Verified RealmEye count:", count);
                process.exitCode = 0;
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 350));
            }
            if (process.exitCode !== 0) {
              console.log("Final document:", JSON.stringify({ title: (await page.title().catch(() => "")).slice(0,120), origin: new URL(page.url()).origin, status, restricted }));
              throw new Error("No verified chart from the one permitted navigation.");
            }
          } finally {
            await browser.close();
          }
          PROBE
