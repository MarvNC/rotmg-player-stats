name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Lint
            command: bun run lint
          - name: Prettier check
            command: bun run format:check
          - name: Test
            command: bun run test
          - name: Build
            command: bun run build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  realmeye-browser-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'dot/realmeye-access-interstitial'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check ordinary browser access without publishing
        run: |
          npm install --prefix "$RUNNER_TEMP/realmeye-probe" --no-audit --no-fund playwright@1.62.1
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/realmeye-probe/node_modules/playwright/index.mjs" bun - <<'PROBE'
          import { readRealmEyeCount } from "./scripts/lib/realmeye.ts";
          const { chromium } = await import(process.env.PLAYWRIGHT_MODULE);
          const browser = await chromium.launch({channel: "chrome", chromiumSandbox: true, timeout: 15000});
          try {
            const page = await browser.newPage();
            const response = await page.goto("https://www.realmeye.com/number-of-active-players-by-rank", {
              waitUntil: "domcontentloaded", timeout: 20000,
            });
            const title = await page.title();
            const status = response?.status();
            const isChallenge = response?.headers()["cf-mitigated"] === "challenge" || /just a moment|verify you are human/i.test(title);
            console.log("Page diagnostics:", JSON.stringify({title: title.slice(0,120), status, isChallenge}));
            if (isChallenge || !response?.ok() || !/number of active players by rank/i.test(title)) {
              throw new Error("No chart on the first ordinary navigation. Stopping without interacting with access checks.");
            }
            console.log("RealmEye browser dry run:", await readRealmEyeCount(new Response(await page.content())));
          } finally {
            await browser.close();
          }
          PROBE
