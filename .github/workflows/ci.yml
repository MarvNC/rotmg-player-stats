name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Lint
            command: bun run lint
          - name: Prettier check
            command: bun run format:check
          - name: Test
            command: bun run test
          - name: Build
            command: bun run build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  realmeye-browser-probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'dot/realmeye-access-interstitial'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check ordinary browser access without publishing
        run: |
          set -eu
          html="$(mktemp)"
          diagnostics="$(mktemp)"
          trap 'rm -f "$html" "$diagnostics"' EXIT
          google-chrome --version
          if ! timeout 45s google-chrome --headless --dump-dom --timeout=25000 https://www.realmeye.com/number-of-active-players-by-rank > "$html" 2> "$diagnostics"; then
            grep -E 'FATAL|sandbox|Running as root' "$diagnostics" | head -5 || true
            echo "::error::Chrome did not complete ordinary page navigation."
            exit 1
          fi
          HTML_FILE="$html" bun -e '
            import { readRealmEyeCount } from "./scripts/lib/realmeye.ts";
            const html = await Bun.file(process.env.HTML_FILE).text();
            const title = html.match(/<title\b[^>]*>([^<]*)<\/title\s*>/i)?.[1]?.trim() ?? "";
            const normalized = title.toLowerCase();
            const rankMarkup = html.includes("renderPlayerRankHistogram");
            const target = normalized.includes("number of active players by rank");
            console.log("Page diagnostics:", JSON.stringify({title: title.slice(0, 120), bytes: html.length, rankMarkup, interstitial: /just a moment|verify you are human|access denied/i.test(html)}));
            if (!target || !rankMarkup) {
              console.error(/just a moment/i.test(html) ? "Browser did not reach the histogram; interstitial remained." : "Browser did not reach the expected chart page.");
              process.exit(1);
            }
            console.log("RealmEye browser dry run:", await readRealmEyeCount(new Response(html)));
          '
